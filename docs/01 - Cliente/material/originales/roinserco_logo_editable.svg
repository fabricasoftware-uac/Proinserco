<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1313" height="1198" viewBox="0 0 1313 1198" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Roinserco — logo editable</title>
  <desc id="descripcion">Recreación vectorial editable del símbolo verde con flecha circular, nombre Roinserco y lema Al servicio de la comunidad. Elementos, colores, degradados y textos separables.</desc>
