      <stop offset="0.31" stop-color="#4b9d09"/>
      <stop offset="0.56" stop-color="#167c08"/>
      <stop offset="0.83" stop-color="#005526"/>
      <stop offset="1" stop-color="#003b1d"/>
    </linearGradient>
